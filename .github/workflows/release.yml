name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: '8.2'

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Create release zip
        run: |
          PLUGIN_SLUG="newspack-revisions-enhanced"
          BUILD_DIR=$(mktemp -d)
          DEST="$BUILD_DIR/$PLUGIN_SLUG"
          mkdir -p "$DEST"

          # Copy all files, then remove those listed in .distignore.
          rsync -a --exclude='.git' ./ "$DEST/"

          while IFS= read -r pattern; do
            pattern=$(echo "$pattern" | xargs)
            [ -z "$pattern" ] && continue
            [[ "$pattern" == \#* ]] && continue
            rm -rf "${DEST:?}/${pattern}"
          done < .distignore

          cd "$BUILD_DIR"
          zip -r "$GITHUB_WORKSPACE/$PLUGIN_SLUG.zip" "$PLUGIN_SLUG/"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            newspack-revisions-enhanced.zip
